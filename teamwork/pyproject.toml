[project]
name = "teamwork"
version = "0.2.0"
description = "ReproJourney maternity risk & governance agents (Agent 4, Agent 5, ReAct main agent)"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
# Real LLM providers. Without these (or without credentials) the agent runs on
# the deterministic offline policy model -- same loop, tools, HITL and audit.
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
dotenv = ["python-dotenv>=1.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

